name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Build Vite app
        shell: bash
        run: |
          set -e

          if [ -f "package.json" ] && [ -f "vite.config.js" ]; then
            npm ci
            npm run build
            mkdir -p pages-dist
            cp -r dist/. pages-dist/
          elif [ -f "frontend/package.json" ] && [ -f "frontend/vite.config.js" ]; then
            cd frontend
            npm ci
            npm run build
            cd ..
            mkdir -p pages-dist
            cp -r frontend/dist/. pages-dist/
          else
            echo "Could not find Vite app in repository root or frontend/"
            exit 1
          fi

          # Prevent GitHub Pages from ignoring files/folders that start with an underscore.
          touch pages-dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
